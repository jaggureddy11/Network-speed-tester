version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: netintel-db
    environment:
      POSTGRES_DB: speedtest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d speedtest"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netintel-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: speedtest
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      # Note: We omit standard actuator healthcheck if it requires configuring actuator starter,
      # but standard curl/wget on /api/network/history will suffice as a healthcheck fallback.
      # Let's use history check to avoid needing spring-boot-starter-actuator explicitly in pom.xml.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/network/history?userId=healthcheck > /dev/null || exit 1"]

  # 3. Next.js Standalone Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netintel-frontend
    environment:
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      - backend
    restart: unless-stopped

  # 4. Nginx Reverse Proxy (Gateway)
  proxy:
    image: nginx:alpine
    container_name: netintel-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
